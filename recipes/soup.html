    <h1>Soup</h1>
    <img

      alt="A bowl of vegetable soup"
    />
    <h2>Description</h2>
    <p>
      Vegetable soup is a simple broth with chopped vegetables, simmered until
      soft.
    </p>
    <h2>Ingredients</h2>
    <ul>
      <li>Broth</li>
      <li>Carrots</li>
      <li>Celery</li>
      <li>Onion</li>
      <li>Salt</li>
    </ul>
    <h2>Steps</h2>
    <ol>
      <li>Chop the vegetables.</li>
      <li>Bring the broth to a simmer.</li>
      <li>Add the vegetables.</li>
      <li>Cook until they are tender.</li>
    </ol>
